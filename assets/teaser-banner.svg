<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="pyramidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f52" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4a3a12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14432a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Subtle accent line (golden section at x=489) -->
  <line x1="489" y1="80" x2="489" y2="560" stroke="#222222" stroke-width="1"/>

  <!-- LEFT: Text area (0–489, golden section 38.2%) -->
  <!-- Title -->
  <text x="70" y="200" fill="#ffffff" font-size="56" font-weight="700">Agentic AI</text>
  <text x="70" y="262" fill="#ffffff" font-size="56" font-weight="700">in der Praxis</text>
  <!-- Subtitle -->
  <text x="70" y="310" fill="#8ab8ff" font-size="26">Vom Spec zum produktiven Workflow</text>
  <!-- Divider -->
  <line x1="70" y1="345" x2="420" y2="345" stroke="#3b6fc4" stroke-width="2"/>
  <!-- Event -->
  <text x="70" y="385" fill="#ffd88a" font-size="22" font-weight="600">IT4Science Days 2026</text>
  <!-- Speakers -->
  <text x="70" y="420" fill="#aaaaaa" font-size="20">Christian Uhl · Tobias Weiß</text>
  <!-- Tagline -->
  <text x="70" y="465" fill="#666666" font-size="16">3h Workshop · Hands-on · Open Source</text>

  <!-- RIGHT: Mini pyramid (centered around x=885, y=320) -->
  <!-- Tier 3: SPEC (top, narrow) -->
  <rect x="785" y="180" width="200" height="90" rx="8" fill="#1a2f52" stroke="#3b6fc4" stroke-width="1.5"/>
  <text x="885" y="218" fill="#8ab8ff" font-size="22" font-weight="700" text-anchor="middle">SPEC</text>
  <text x="885" y="248" fill="#6a9ad8" font-size="13" text-anchor="middle">Source of Truth</text>

  <!-- Tier 2: CONTRACT (middle) -->
  <rect x="700" y="285" width="370" height="90" rx="8" fill="#4a3a12" stroke="#b88a2e" stroke-width="1.5"/>
  <text x="885" y="323" fill="#ffd88a" font-size="22" font-weight="700" text-anchor="middle">CONTRACT</text>
  <text x="885" y="353" fill="#c8a45c" font-size="13" text-anchor="middle">Delta-Spec — the agent's prompt</text>

  <!-- Tier 1: TESTS (base, wide) -->
  <rect x="580" y="390" width="610" height="90" rx="8" fill="#14432a" stroke="#2f9e5f" stroke-width="1.5"/>
  <text x="885" y="428" fill="#7ee2a8" font-size="22" font-weight="700" text-anchor="middle">TESTS</text>
  <text x="885" y="458" fill="#5cb886" font-size="13" text-anchor="middle">Verify · Validate · Regenerate</text>

  <!-- Flow arrows (right side mini) -->
  <line x1="560" y1="270" x2="560" y2="285" stroke="#444444" stroke-width="1.5" marker-end="url(#arrowDownSm)"/>
  <line x1="560" y1="375" x2="560" y2="390" stroke="#444444" stroke-width="1.5" marker-end="url(#arrowDownSm)"/>
  <defs>
    <marker id="arrowDownSm" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M1,1 L4,7 L7,1" fill="none" stroke="#444444" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Bottom caption -->
  <text x="885" y="510" fill="#666666" font-size="15" text-anchor="middle" font-style="italic">one config · one re-run · the pipeline is the judge</text>

  <!-- Bottom-right watermark -->
  <text x="1210" y="610" fill="#333333" font-size="13" text-anchor="end">github.com/tobias-weiss-ai-xr/IT4Science-Days-2026-agentic-ai-workshop</text>
</svg>
