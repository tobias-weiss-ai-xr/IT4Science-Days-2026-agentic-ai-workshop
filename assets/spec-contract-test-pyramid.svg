<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="600" y="55" fill="#ffffff" font-size="36" font-weight="700" text-anchor="middle">Spec · Contract · Test</text>
  <text x="600" y="88" fill="#888888" font-size="20" text-anchor="middle">The verification pyramid of spec-driven agentic development</text>

  <!-- Flow arrows (left side, downward) -->
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M1,1 L5,9 L9,1" fill="none" stroke="#555555" stroke-width="1.5"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto">
      <path d="M1,9 L5,1 L9,9" fill="none" stroke="#555555" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Arrow: Spec → Contract (left, downward) -->
  <line x1="50" y1="280" x2="50" y2="300" stroke="#555555" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="65" y="295" fill="#666666" font-size="14" font-style="italic">governs</text>

  <!-- Arrow: Contract → Tests (left, downward) -->
  <line x1="50" y1="440" x2="50" y2="460" stroke="#555555" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="65" y="455" fill="#666666" font-size="14" font-style="italic">implements</text>

  <!-- Arrow: Tests → Spec (right, upward, the feedback loop) -->
  <line x1="1150" y1="460" x2="1150" y2="180" stroke="#555555" stroke-width="2" marker-end="url(#arrowUp)" stroke-dasharray="6,4"/>
  <text x="1165" y="320" fill="#666666" font-size="14" font-style="italic" transform="rotate(90, 1165, 320)">verifies &amp; evolves</text>

  <!-- Tier 3: SPEC (top, narrow — golden ratio width 382) -->
  <rect x="409" y="140" width="382" height="140" rx="10" fill="#1a2f52" stroke="#3b6fc4" stroke-width="2"/>
  <text x="600" y="185" fill="#8ab8ff" font-size="30" font-weight="700" text-anchor="middle">SPEC</text>
  <text x="600" y="215" fill="#e8e8e8" font-size="18" text-anchor="middle">Source of Truth — behavioral contracts</text>
  <text x="600" y="250" fill="#6a9ad8" font-size="15" text-anchor="middle" font-family="monospace">openspec/specs/*/spec.md · SHALL · MUST · GIVEN/WHEN/THEN</text>

  <!-- Tier 2: CONTRACT (middle — golden ratio width 618) -->
  <rect x="291" y="300" width="618" height="140" rx="10" fill="#4a3a12" stroke="#b88a2e" stroke-width="2"/>
  <text x="600" y="345" fill="#ffd88a" font-size="30" font-weight="700" text-anchor="middle">CONTRACT</text>
  <text x="600" y="375" fill="#e8e8e8" font-size="18" text-anchor="middle">Delta-Spec — the agent's prompt</text>
  <text x="600" y="410" fill="#c8a45c" font-size="15" text-anchor="middle" font-family="monospace">changes/&lt;name&gt;/ — proposal · design · specs · tasks</text>

  <!-- Tier 1: TESTS (base, wide — golden ratio width 1000) -->
  <rect x="100" y="460" width="1000" height="140" rx="10" fill="#14432a" stroke="#2f9e5f" stroke-width="2"/>
  <text x="600" y="505" fill="#7ee2a8" font-size="30" font-weight="700" text-anchor="middle">TESTS</text>
  <text x="600" y="535" fill="#e8e8e8" font-size="18" text-anchor="middle">Verify, validate, regenerate</text>
  <text x="600" y="570" fill="#5cb886" font-size="15" text-anchor="middle" font-family="monospace">validate_papers.py · generate_readme.py --check · CI pass/fail</text>

  <!-- Loop caption -->
  <text x="600" y="660" fill="#888888" font-size="18" text-anchor="middle" font-style="italic">Spec governs → Contract implements → Tests verify → Spec evolves</text>

  <!-- Principles footer (Stoic Unix, shown through deeds, not named) -->
  <text x="600" y="700" fill="#555555" font-size="15" text-anchor="middle">one config · one re-run · each tool does one thing · never edit what is generated · the pipeline is the judge</text>

  <!-- Thin golden-ratio composition guides (very faint) -->
  <line x1="236" y1="130" x2="236" y2="610" stroke="#222222" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.4"/>
  <line x1="964" y1="130" x2="964" y2="610" stroke="#222222" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.4"/>
</svg>
